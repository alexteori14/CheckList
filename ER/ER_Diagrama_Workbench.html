<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartCheck Enterprise — Diagrama Físico EER (MySQL Workbench Style)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #0f172a;
      color: #f1f5f9;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    header {
      background: #1e293b;
      border-bottom: 1px solid #334155;
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 10;
    }
    .title-box h1 {
      font-size: 16px;
      font-weight: 700;
      color: #38bdf8;
      letter-spacing: -0.2px;
    }
    .title-box p {
      font-size: 12px;
      color: #94a3b8;
      margin-top: 2px;
    }
    .controls {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    button {
      background: #334155;
      color: #f8fafc;
      border: 1px solid #475569;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    button:hover {
      background: #475569;
      border-color: #64748b;
    }
    button.primary {
      background: #0284c7;
      border-color: #0369a1;
    }
    button.primary:hover {
      background: #0369a1;
    }
    #viewport {
      flex: 1;
      overflow: auto;
      background: #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      cursor: grab;
    }
    #viewport:active {
      cursor: grabbing;
    }
    #svg-container {
      transform-origin: center center;
      transition: transform 0.05s ease-out;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
    }
    #svg-container object, #svg-container img {
      display: block;
      max-width: none;
    }
    .zoom-badge {
      font-size: 12px;
      color: #94a3b8;
      font-weight: 600;
      min-width: 45px;
      text-align: center;
    }
  </style>
</head>
<body>
  <header>
    <div class="title-box">
      <h1>SmartCheck Enterprise — Diagrama Físico EER (MySQL Server 8.0+ / 3FN)</h1>
      <p>Notación Crow's Foot Oficial de Ingeniería en Base de Datos | Estilo MySQL Workbench | 10 Entidades (Sin tabla roles)</p>
    </div>
    <div class="controls">
      <span class="zoom-badge" id="zoomLevel">100%</span>
      <button onclick="zoomOut()">−</button>
      <button onclick="resetZoom()">1:1</button>
      <button onclick="zoomIn()">+</button>
      <button class="primary" onclick="fitScreen()">Ajustar a Pantalla</button>
      <button onclick="window.print()">Exportar PDF</button>
    </div>
  </header>

  <div id="viewport">
    <div id="svg-container">
      <img id="diagramImg" src="./ER_Diagrama_Fisico.svg" alt="Diagrama Físico EER SmartCheck Enterprise" width="1820" height="1520" />
    </div>
  </div>

  <script>
    let scale = 1;
    let isPanning = false;
    let startX = 0, startY = 0;
    const viewport = document.getElementById('viewport');
    const container = document.getElementById('svg-container');
    const zoomBadge = document.getElementById('zoomLevel');

    function updateTransform() {
      container.style.transform = `scale(${scale})`;
      zoomBadge.textContent = Math.round(scale * 100) + '%';
    }

    function zoomIn() {
      scale = Math.min(scale * 1.2, 3.5);
      updateTransform();
    }

    function zoomOut() {
      scale = Math.max(scale / 1.2, 0.25);
      updateTransform();
    }

    function resetZoom() {
      scale = 1;
      updateTransform();
    }

    function fitScreen() {
      const vWidth = viewport.clientWidth - 40;
      const vHeight = viewport.clientHeight - 40;
      const scaleX = vWidth / 1820;
      const scaleY = vHeight / 1520;
      scale = Math.min(scaleX, scaleY, 1);
      updateTransform();
    }

    viewport.addEventListener('wheel', (e) => {
      e.preventDefault();
      if (e.deltaY < 0) zoomIn();
      else zoomOut();
    });

    window.addEventListener('load', () => {
      fitScreen();
    });
    window.addEventListener('resize', () => {
      // Keep within bounds
    });
  </script>
</body>
</html>
